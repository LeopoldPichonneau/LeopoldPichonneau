<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Meet the CTO: Grognasse, Chief Treat Officer">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121212"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ring, .ring2 { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
    .ring2 { animation-duration: 9s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .dog { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg) } 50% { transform: translateY(-4px) rotate(3deg) } }
    .breathe { animation: breathe 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 50% { transform: scale(1.08); fill-opacity: .16 } }
    .row { animation: in .8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes in { from { opacity: 0; transform: translateX(-12px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="998" height="218" rx="20" fill="url(#card)" stroke="#3a3a3a"/>
  <circle cx="130" cy="110" r="58" fill="#ff9d6c" fill-opacity=".08" class="breathe"/>
  <circle class="ring" cx="130" cy="110" r="72" fill="none" stroke="#ff9d6c" stroke-opacity=".6" stroke-dasharray="3 7"/>
  <circle class="ring2" cx="130" cy="110" r="84" fill="none" stroke="#ff9d6c" stroke-opacity=".35" stroke-dasharray="40 200" stroke-linecap="round"/>
  <g class="dog"><text x="130" y="140" font-size="76" text-anchor="middle">🐶</text></g>

  <text x="270" y="52" font-size="12" fill="#9e9e9e" letter-spacing="3">MEET THE CTO</text>
  <text x="270" y="90" font-size="30" font-weight="800" fill="#eeeeee">Grognasse <tspan font-size="14" font-weight="400" fill="#ff9d6c">· Chief Treat Officer</tspan></text>

  <g font-size="14">
    <g class="row" style="animation-delay:.2s"><text x="270" y="130" fill="#9e9e9e">Management style</text><text x="490" y="130" fill="#eeeeee">Screaming</text></g>
    <g class="row" style="animation-delay:.4s"><text x="270" y="158" fill="#9e9e9e">Salary</text><text x="490" y="158" fill="#eeeeee">Chicken</text></g>
    <g class="row" style="animation-delay:.6s"><text x="270" y="186" fill="#9e9e9e">Technical skills</text><text x="490" y="186" fill="#eeeeee">Sleeping, Barking, Breaking Production</text></g>
  </g>
</svg>

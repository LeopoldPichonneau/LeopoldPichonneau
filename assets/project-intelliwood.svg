<svg xmlns="http://www.w3.org/2000/svg" width="322" height="232" viewBox="9 9 322 232" role="img" aria-label="IntelliWood">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9d6c"/><stop offset="1" stop-color="#ff9d6c"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151515"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .card { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity:0; transform: translateY(16px) } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
    @keyframes ping { from { opacity:.8; transform: scale(1) } to { opacity:0; transform: scale(3) } }
    .edge { stroke-dasharray: 90 910; animation: run 7s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -1000 } }
    .arrow { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translate(4px,-4px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="card" style="animation-delay:0.00s">
    <rect x="10" y="10" width="320" height="230" rx="18" fill="url(#bg)" stroke="#3b3b3b"/>
    <rect class="edge" x="10" y="10" width="320" height="230" rx="18" fill="none" stroke="url(#g)" stroke-width="2" pathLength="1000" style="animation-delay:0.0s"/>
    <text x="36" y="80" font-size="22" font-weight="800" fill="#eeeeee">IntelliWood</text>
    <g class="arrow"><path d="M290 48 l16 -16 M292 32 h14 v14" fill="none" stroke="#ff9d6c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="36" y="128" font-size="13" fill="#c8c8c8">IoT monitoring and management</text>
    <text x="36" y="148" font-size="13" fill="#c8c8c8">system for wood granule heating</text>
    <text x="36" y="168" font-size="13" fill="#c8c8c8">and storage.</text>
    <rect x="36" y="196" width="39" height="26" rx="13" fill="#ffffff" fill-opacity=".07"/>
    <text x="55.5" y="213" font-size="12" text-anchor="middle" fill="#eeeeee">C</text>
    <rect x="212" y="196" width="92" height="26" rx="13" fill="#4ade80" fill-opacity=".12"/>
    <circle cx="228" cy="209" r="4" fill="#4ade80"/><circle class="ping" cx="228" cy="209" r="4" fill="#4ade80"/>
    <text x="240" y="213" font-size="12" fill="#4ade80">Active</text>
  </g>
</svg>